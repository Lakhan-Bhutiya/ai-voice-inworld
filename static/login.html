<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · AI Voice Inworld TTS Studio</title>

  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
</head>

<body>

  <main class="login-shell">
    <div class="login-card panel">
      <div class="login-mark">AV</div>
      <div class="hero-eyebrow"><span class="micro">Inworld TTS · Proof of concept</span></div>
      <h1 class="hero-line login-title">Sign in to the<br><span class="accent-mark">studio.</span></h1>

      <form id="loginForm" class="login-form" novalidate>
        <label class="micro" for="username">Username</label>
        <input class="direction-input" type="text" id="username" name="username" autocomplete="username"
          autocapitalize="none" spellcheck="false" required autofocus />

        <label class="micro mt-3" for="password">Password</label>
        <input class="direction-input" type="password" id="password" name="password"
          autocomplete="current-password" required />

        <p class="login-error" id="loginError" role="alert" hidden></p>

        <button class="btn-lime login-submit" type="submit" id="loginSubmit">
          <i class="fa-solid fa-arrow-right-to-bracket" aria-hidden="true"></i> Sign in
        </button>
      </form>

      <div class="login-foot">
        <div class="status-chip" role="status" aria-live="polite">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Checking…</span>
        </div>
        <button type="button" class="rail-theme-toggle theme-toggle-btn" id="themeToggle"
          aria-label="Switch to dark theme">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>
    </div>
  </main>

  <script type="module" src="/static/js/login.js"></script>
</body>

</html>
